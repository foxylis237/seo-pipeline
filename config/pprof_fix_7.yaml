# Схема стадий pprof_fix_7.
#
# Правку этой задачи готовит не модель в прогоне, а заранее: исправленные тексты лежат в
# input/pprof_fix_7/prepared и в run только сверяются и записываются в блог.
# Поэтому run клиента модели не поднимает, и схема ниже нужна профилю задачи (стадия одна:
# rewrite) и регламенту правки, который назван в ней файлом.
#
# Провайдер один, наложения нет: выбирать между схемами не из чего.
llm:
  providers:
    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true
      single_chat_per_article: true

  stages:
    # Правка опубликованной статьи по регламенту tasks/pprof_fix_7/prompts/rewrite.txt.
    rewrite:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_fix_7/prompts/rewrite.txt
      mode: default
      temperature: 0.1
      max_tokens: 16000
      timeout: 1200s
      attempt_timeout: 420s
