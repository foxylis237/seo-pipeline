# Схема стадий pprof_audit_1.
#
# Стадия одна: audit. Она же единственный запрос к модели за страницу — задача не пишет и не
# правит текст, а проверяет уже опубликованный: код читает страницу и её поля из блога,
# заполненность обязательных полей считает сам, а у модели спрашивает то, что она одна и может
# сказать, — что не так с текстом и со значениями полей.
#
# Дописывания оборванного ответа у стадии нет и не предусмотрено: ответ аудита это десяток
# строк, он помещается в одно сообщение. Поэтому и бюджет её заметно меньше, чем у правки,
# хотя в промпт уходит вся страница целиком.
#
# Провайдер один, наложения нет: выбирать между схемами не из чего.
llm:
  providers:
    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true
      # Один диалог на страницу: проверка соседней страницы не должна видеть предыдущую.
      single_chat_per_article: true

  stages:
    # Проверка опубликованной страницы. Ответ — отчёт по формату из промпта.
    audit:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_audit_1/prompts/audit.txt
      mode: default
      temperature: 0.1
      max_tokens: 8000
      timeout: 900s
      attempt_timeout: 420s
