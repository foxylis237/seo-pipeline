# Схема стадий pprof_1.
#
# Задача сегодня DeepSeek-only: провайдер один, наложения нет, выбирать между схемами не из
# чего. Файл самостоятельный, а не наложение на config/config.yaml, — task_1 и pprof_1
# должны расходиться свободно, и правка одного не имеет права менять другой.
#
# Поток генерации — три чата, границы между ними значимы:
#
#   чат 1: structure
#   чат 2: expert → review → info
#   чат 3: html
#
# Внутри чата 2 каждое следующее сообщение опирается на историю, поэтому промпты этих стадий
# статью повторно не передают.
llm:
  providers:
    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true
      # Один диалог на статью: без него браузерный клиент открывал бы новую беседу на каждое
      # сообщение, и история внутри чата 2 терялась бы. Границы между тремя чатами задаёт сам
      # поток — первое сообщение каждого чата просит начать новую беседу.
      single_chat_per_article: true

  # Режим ответа DeepSeek: значение сверяется с data-model-type переключателя над полем
  # ввода — expert («Expert») рассуждает, default («Instant») отвечает сразу. Подписи
  # локализованы (в профиле сейчас английские), атрибут — нет, поэтому в конфигурации стоит
  # он. Переключатель живёт на экране нового чата: у pprof_1 их три, и каждый выбирает
  # режим сам; сообщения внутри чата 2 режим не переключают.
  #
  # Два бюджета времени у каждой стадии. timeout — общий на все попытки, attempt_timeout —
  # на одну. Раздельными они стали после отказа DeepSeek «Server is busy»: пока бюджет был
  # один, первая же попытка выбирала его целиком, и повтор не начинался никогда. Отказ
  # распознаётся сразу, поэтому запас поверх одной попытки — под паузы между повторами
  # (перегрузку пережидают минутами), а не под тройную генерацию.
  stages:
    # keywords — резервный источник исходных запросов для prepare, а не стадия генерации.
    # Вызывается, только когда Keys.so не нашёл у конкурента ни одного запроса.
    keywords:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/keywords.txt
      mode: expert
      temperature: 0.2
      max_tokens: 3000
      timeout: 600s
      attempt_timeout: 180s

    # article — старый базовый промпт статьи. В модель НЕ отправляется: поток собирает его из
    # входных данных и research, кладёт в prompts/article_prompt.txt и выгружает в Google Docs.
    # Текст статьи пишет стадия expert.
    article:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/article.txt
      temperature: 0.7
      max_tokens: 10000
      timeout: 300s

    # Чат 1.
    structure:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/structure.txt
      # Регламент структуры и объёма. Прикрепить его можно только в режиме default: в Expert
      # DeepSeek не рисует поле загрузки файла вовсе — проверено снимком страницы отказа.
      attachments_dir: input/pprof_1/regulations/article
      mode: default
      temperature: 0.3
      max_tokens: 3000
      timeout: 600s
      attempt_timeout: 180s

    # Чат 2, сообщение 1: статью пишет практикующий специалист по структуре из чата 1.
    expert:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/1_expert.txt
      # Тот же регламент. Режим снят с expert на default ради вложения — см. стадию structure.
      attachments_dir: input/pprof_1/regulations/article
      mode: default
      # Поиск включён только здесь: текст статьи пишет эта стадия, и источник под таблицей
      # заработка обязан быть тем сайтом, который модель действительно открыла, а не
      # приписанным по памяти. Остальные стадии правят уже написанное — искать им нечего,
      # а поиск замедляет ответ и уводит на посторонние сайты.
      search: true
      temperature: 0.7
      max_tokens: 12000
      timeout: 900s
      attempt_timeout: 420s

    # Чат 2, сообщение 2: SEO-редактура и ревью одним проходом. Раньше это были две стадии,
    # seo_editor и review; на 34 сохранённых статьях они вдвоём меняли около 1% слов, потому
    # что просили одно и то же дважды. Объединённый промпт втрое короче суммы прежних:
    # веб-интерфейс DeepSeek теряет длинные перечни требований, и лишний проход по статье
    # усредняет текст, а не улучшает его. Имя стадии осталось прежним — на review завязаны
    # слоты артефактов и этапы возобновления.
    review:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/2_editor.txt
      # Регламент сюда не прикрепляется намеренно: он уже пришёл документом в первое
      # сообщение этого же чата, и беседа его помнит. Промпт на него ссылается.
      mode: expert
      temperature: 0.4
      max_tokens: 12000
      timeout: 900s
      attempt_timeout: 420s

    # Чат 2, сообщение 3: метаданные по статье из этого же чата. Идут последними — TL;DR и
    # FAQ обязаны описывать опубликованный текст, а не черновик до редактуры.
    info:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/info.txt
      mode: expert
      temperature: 0.2
      max_tokens: 4000
      timeout: 780s
      attempt_timeout: 300s

    # Чат 3: разметка и перелинковка. Начинается с чистой истории, поэтому статью получает явно.
    # Вместе с промптом в чат уходит регламент статей: он приходит документом, а не текстом
    # промпта. Имя файла не фиксируется — значим каталог, и в нём должен лежать ровно один PDF.
    # Каталог лежит во входных данных самой задачи: регламент относится к pprof_1, а не к
    # пайплайну вообще. Понадобится общий — появится каталог рядом, а не переезд этого.
    html:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/pprof_1/prompts/4_html.txt
      attachments_dir: input/pprof_1/regulations/html
      mode: default
      temperature: 0.1
      max_tokens: 14000
      timeout: 900s
      attempt_timeout: 420s

# Чем прогон занимается помимо генерации текста.
#
# Здесь выключаются шаги, которые уходят наружу: в блог и в чужой Google Drive. Сами стадии
# генерации отсюда не управляются — их порядок раннер выводит из сохранённых артефактов
# статьи, и выключенная посередине стадия означала бы статью, которую нечем достроить.
pipeline:
  # Публикация в WordPress сразу после прогона — и после regenerate тоже. Выключена: промпты и
  # регламент переписаны, и первые прогоны нужно посмотреть глазами, прежде чем текст уйдёт в
  # живой блог. Отменить публикацию приложение не умеет.
  # Включить обратно — вернуть true; статьи, накопленные за это время, выкладываются командой
  # `make pprof-1 publish <id>`.
  publish_after_run: false
  # Выгрузка промпта статьи в Google Docs по ходу прогона.
  google_docs: true
