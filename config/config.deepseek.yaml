# DeepSeek-only режим: наложение на config/config.yaml.
#
# Включается переменной LLM_MODE=deepseek. Здесь перечислено только то, что отличается от
# базовой конфигурации: провайдер стадии, путь к промпту и флаг одного диалога. Таймауты,
# температуры и max_tokens остаются в базовом файле и не расходятся между режимами.
#
# Все шесть стадий одной статьи идут в ОДНОМ чате DeepSeek: structure -> article -> info ->
# review -> fix -> html. Новая беседа открывается только при смене статьи. Поэтому промпты
# здесь свои: они опираются на историю диалога, а не пересылают результат прошлой стадии.
llm:
  providers:
    deepseek_web:
      single_chat_per_article: true

  # Режим ответа DeepSeek: значение сверяется с data-model-type переключателя над полем
  # ввода — expert («Expert») рассуждает, default («Instant») отвечает сразу. Подписи
  # локализованы (в профиле сейчас английские), атрибут — нет, поэтому в конфигурации стоит
  # он. Переключатель живёт на экране нового чата: продолжение беседы режим не меняет.
  # Gemini поле игнорирует.
  stages:
    structure:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/structure.txt
      mode: expert
      timeout: 180s

    article:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/article.txt
      mode: expert
      timeout: 300s

    info:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/article_info.txt
      mode: expert
      timeout: 300s

    review:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/review.txt
      mode: expert
      timeout: 300s

    fix:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/fix_article.txt
      mode: expert
      timeout: 420s

    html:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/deepseek/html.txt
      mode: default
      timeout: 420s
