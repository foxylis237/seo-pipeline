llm:
  providers:
    gemini:
      type: gemini
      api_key_env: GEMINI_API_KEY
  stages:
    structure:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/structure.txt
      temperature: 0.3
      max_tokens: 3000
      timeout: 120s

    article:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/article.txt
      temperature: 0.7
      max_tokens: 10000
      timeout: 180s

    info:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/article_info.txt
      temperature: 0.2
      max_tokens: 4000
      timeout: 180s

    review:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/review.txt
      temperature: 0.2
      max_tokens: 5000
      timeout: 120s

    fix:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/fix_article.txt
      temperature: 0.4
      max_tokens: 10000
      timeout: 300s

    html:
      provider: gemini
      model: ${GEMINI_MODEL}
      prompt: tasks/task_1/prompts/html.txt
      temperature: 0.1
      max_tokens: 12000
      timeout: 180s
