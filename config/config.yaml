llm:
  providers:
    gemini:
      type: gemini
      api_key_env: GEMINI_API_KEY

    openrouter:
      type: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY

    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true

  stages:
    structure:
      targets: &default_targets
        - { provider: gemini, model: "${GEMINI_MODEL}" }
        - { provider: openrouter, model: "${OPENROUTER_MODEL}" }
      prompt: tasks/task_1/prompts/structure.txt
      temperature: 0.3
      max_tokens: 3000
      timeout: 120s

    article:
      targets: *default_targets
      prompt: tasks/task_1/prompts/article.txt
      temperature: 0.7
      max_tokens: 10000
      timeout: 180s

    info:
      targets: *default_targets
      prompt: tasks/task_1/prompts/article_info.txt
      temperature: 0.2
      max_tokens: 4000
      timeout: 180s

    review:
      targets: *default_targets
      prompt: tasks/task_1/prompts/review.txt
      temperature: 0.2
      max_tokens: 5000
      timeout: 120s

    fix:
      targets: *default_targets
      prompt: tasks/task_1/prompts/fix_article.txt
      temperature: 0.4
      max_tokens: 10000
      timeout: 300s

    html:
      targets: *default_targets
      prompt: tasks/task_1/prompts/html.txt
      temperature: 0.1
      max_tokens: 12000
      timeout: 180s
