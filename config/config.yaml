llm:
  providers:
    gemini:
      type: gemini
      api_key_env: GEMINI_API_KEY

    openrouter:
      type: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY

    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true

  stages:
    # keywords — не стадия генерации статьи, а резервный источник исходных запросов для
    # prepare. Вызывается только тогда, когда Keys.so не отдал ни одного запроса
    # конкурента; результат уходит в ту же очистку Keys.so, что и обычный сбор.
    # Провайдер один и тот же в обеих схемах: искать семантику через Gemini смысла нет,
    # а DeepSeek уже настроен и не тратит квоту генерации.
    keywords:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/keywords.txt
      temperature: 0.2
      max_tokens: 3000
      timeout: 180s

    # Режим Gemini: article, review и fix идут только через Gemini, без резерва на
    # DeepSeek. Смешивать провайдеров внутри одной статьи нельзя — когда токены Gemini
    # заканчиваются, статья целиком генерируется в DeepSeek-only режиме
    # (LLM_MODE=deepseek, наложение config/config.deepseek.yaml).
    structure:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/structure.txt
      temperature: 0.3
      max_tokens: 3000
      timeout: 120s

    article:
      targets:
        - { provider: gemini, model: "${GEMINI_MODEL}" }
      prompt: tasks/task_1/prompts/article.txt
      temperature: 0.7
      max_tokens: 10000
      timeout: 180s

    info:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/article_info.txt
      temperature: 0.2
      max_tokens: 4000
      timeout: 180s

    review:
      targets:
        - { provider: gemini, model: "${GEMINI_MODEL}" }
      prompt: tasks/task_1/prompts/review.txt
      temperature: 0.2
      max_tokens: 5000
      timeout: 120s

    # fix продолжает чат, начатый на стадии review, и идёт к тому же провайдеру, который
    # ответил на review. Перебор targets здесь не выполняется — список нужен только потому,
    # что валидация конфигурации требует хотя бы один target у каждой стадии.
    fix:
      targets:
        - { provider: gemini, model: "${GEMINI_MODEL}" }
      prompt: tasks/task_1/prompts/fix_article.txt
      temperature: 0.4
      max_tokens: 10000
      timeout: 300s

    html:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/task_1/prompts/html.txt
      temperature: 0.1
      max_tokens: 12000
      timeout: 180s
