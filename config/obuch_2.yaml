# Схема стадий obuch_2.
#
# Задача DeepSeek-only: провайдер один, наложения нет, выбирать между схемами не из чего.
# Файл самостоятельный, а не наложение на config/pprof_2.yaml: площадки разные, и промпты
# обязаны расходиться свободно — правка одной задачи не имеет права менять другую.
#
# Поток генерации — три чата, границы между ними значимы:
#
#   чат 1: structure
#   чат 2: article → review
#   чат 3: html + строки карточки призыва
#
# Стадии info у задачи нет и не будет: частые вопросы остаются в теле страницы, потому что
# поля под них у площадки не существует — ни репитера, ни отдельных ключей. TL;DR и время
# чтения задача не генерирует вовсе.
llm:
  providers:
    deepseek_web:
      type: deepseek_web
      chat_url: https://chat.deepseek.com/
      login_url: https://chat.deepseek.com/sign_in
      profile_dir: data/browser/deepseek
      headless: true
      # Один диалог на страницу: без него браузерный клиент открывал бы новую беседу на
      # каждое сообщение, и история внутри чата 2 терялась бы. Границы между тремя чатами
      # задаёт сам поток — первое сообщение каждого чата просит начать новую беседу.
      single_chat_per_article: true

  # Режим ответа DeepSeek: expert рассуждает, default отвечает сразу. Два бюджета времени у
  # каждой стадии: timeout — общий на все попытки, attempt_timeout — на одну. Раздельными они
  # стали после отказа DeepSeek «Server is busy»: пока бюджет был один, первая же попытка
  # выбирала его целиком, и повтор не начинался никогда.
  #
  # Поиск в интернете включён ровно у одной стадии — article. Числа программы приходят
  # колонками книги, нормативная база и логика отрасли модели известны, а искать нужно одно:
  # источник под таблицей заработка. Он обязан быть сайтом, который модель действительно
  # открыла, иначе строка «Источник: hh.ru» — выдуманная ссылка на проверяемые цифры.
  #
  # Работает он там потому, что переключатель относится к чату целиком и трогается только на
  # его первом сообщении: article открывает чат 2. Поставь search у review — и он не
  # сработает вовсе, молча. Остальным стадиям искать нечего: они правят написанное, а поиск
  # замедляет ответ и уводит на посторонние сайты.
  stages:
    # keywords — резервный источник исходных запросов для prepare, а не стадия генерации.
    # Вызывается, только когда Keys.so не нашёл у конкурента ни одного запроса.
    keywords:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/obuch_2/prompts/keywords.txt
      mode: expert
      temperature: 0.2
      max_tokens: 3000
      timeout: 600s
      attempt_timeout: 180s

    # Чат 1: модули, портреты аудитории и формулировки заголовков внутри готового скелета.
    # Сам скелет страницы зашит в промпт: он снят с живых страниц площадки, а не сочиняется
    # заново на каждой странице.
    structure:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/obuch_2/prompts/structure.txt
      mode: expert
      temperature: 0.3
      max_tokens: 3000
      timeout: 600s
      attempt_timeout: 180s

    # Чат 2, сообщение 1: основной промпт. Он уходит в модель, а не только в артефакт:
    # страницу пишет именно он. Тот же отрендеренный текст сохраняется в
    # prompts/article_prompt.txt.
    article:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/obuch_2/prompts/article.txt
      mode: expert
      # Единственная стадия задачи с поиском: страницу пишет она, и источник под таблицей
      # заработка обязан быть сайтом, который модель правда открыла. Она же открывает чат 2,
      # а переключатель поиска относится к чату целиком — у стадии-продолжения он молчит.
      search: true
      temperature: 0.7
      max_tokens: 12000
      timeout: 900s
      attempt_timeout: 420s

    # Чат 2, сообщение 2: редактура возвращает исправленную страницу целиком, а не список
    # замечаний. Отдельного шага fix у задачи нет: этот текст и есть финальная страница, и он
    # же уходит в разметку.
    #
    # Страница передаётся промпту явно, хотя чат тот же: правится сохранённый артефакт, а не
    # пересказ по памяти. Бюджеты и max_tokens как у article — ответ такого же размера.
    review:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/obuch_2/prompts/review.txt
      mode: expert
      temperature: 0.3
      max_tokens: 12000
      timeout: 900s
      attempt_timeout: 420s

    # Чат 3: разметка по вёрстке площадки. Начинается с чистой истории, поэтому страницу
    # получает явно. Регламента вёрстки документом здесь нет: вёрстка площадки — классы
    # wp-block-*, ноль инлайновых стилей, одна таблица — описана в самом промпте, и второй её
    # копии документом заводить нельзя, они разойдутся молча.
    #
    # Сообщений у этого чата четыре: три на разметку с дописыванием оборванного ответа и одно
    # на строки карточки призыва. Саму карточку ставит код по шаблону
    # tasks/obuch_2/templates/cta_card.html, у модели спрашиваются пять строк текста внутри
    # неё. Адрес среди них не спрашивается: кнопка открывает форму, а не ведёт на программу.
    html:
      targets:
        - { provider: deepseek_web, model: deepseek-web }
      prompt: tasks/obuch_2/prompts/html.txt
      mode: default
      temperature: 0.1
      max_tokens: 14000
      timeout: 900s
      attempt_timeout: 420s

# Чем прогон занимается помимо генерации текста.
#
# Здесь выключаются шаги, которые уходят наружу: в блог и в чужой Google Drive. Сами стадии
# генерации отсюда не управляются — их порядок раннер выводит из сохранённых артефактов
# страницы, и выключенная посередине стадия означала бы страницу, которую нечем достроить.
pipeline:
  # Публикация в WordPress сразу после прогона. Выключена: раскладка полей этой площадки ещё
  # не сверена с живой записью, а отменить публикацию приложение не умеет. Первые страницы
  # выкладываются руками — `publish plan <id>`, затем `publish <id>`, — и только когда запись
  # в блоге совпала с ожидаемой, признак переключается в true.
  publish_after_run: false
  # Выгрузка промпта страницы в Google Docs. Выключена: своей папки Drive у задачи ещё нет, а
  # общая перезаписывает документы соседей по совпадению имени «Промт: <заголовок>».
  # Включается одной строкой вместе с Profile.GoogleFolderURL, когда папку заведут.
  google_docs: false
  # Keys.so: сбор запросов у конкурента и их очистка. При отказе включённого Keys.so (лимит,
  # таймаут) запросы подбирает модель по промпту keywords, и лог помечает это
  # «ПРОБЛЕМА С KEYS.SO».
  keysso: true
