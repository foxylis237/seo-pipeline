services:
  postgres:
    image: postgres:17-alpine
    container_name: seo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: seo
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: