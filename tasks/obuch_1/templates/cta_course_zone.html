<div class="cta-course-zone" style="background: #fff8f2; padding: 30px; border-top: 4px solid #ff7500; border-radius: 6px; margin-top: 25px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <h3 style="margin-top: 0; color: #1a1a1a; font-size: 20px; font-weight: 700;">{{.Title}}</h3>
    <p style="color: #333333; line-height: 1.6; font-size: 15px; margin-bottom: 15px;">{{.Lead1}}</p>
    <p style="color: #333333; line-height: 1.6; font-size: 15px; margin-bottom: 20px;">{{.Lead2}}</p>
    <h4 style="color: #1a1a1a; font-size: 17px; font-weight: 600; margin-top: 20px; margin-bottom: 12px;">Что вы получите по итогам обучения:</h4>
    <ul style="padding-left: 20px; color: #333333; line-height: 1.6; font-size: 15px;">
        <li style="margin-bottom: 8px;">{{.Benefit1}}</li>
        <li style="margin-bottom: 8px;">{{.Benefit2}}</li>
        <li style="margin-bottom: 8px;">{{.Benefit3}}</li>
    </ul>
    <div style="margin-top: 25px;">
        <a href="{{.ButtonURL}}" target="_blank" style="display: inline-block; background: #ff7500; color: #ffffff; padding: 14px 28px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 16px; transition: background 0.2s ease-in-out;">{{.ButtonText}}</a>
    </div>
</div>
