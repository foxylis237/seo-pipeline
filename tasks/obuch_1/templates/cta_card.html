<!-- wp:html -->
<div class="sp-cta-card" style="background:linear-gradient(135deg,#f8fafc 0%,#edf2f7 100%);border:1px solid #cbd5e1;border-radius:12px;padding:28px 32px;margin:35px 0;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="margin-bottom:20px;">
    <span style="background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:10px;">{{.Badge}}</span>
    <h3 style="margin:0 0 8px 0;color:#0f172a;font-size:22px;font-weight:800;line-height:1.3;">{{.Heading}}</h3>
    <p style="margin:0;color:#475569;font-size:15px;line-height:1.5;">{{.Intro}}</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#ffffff;padding:16px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:24px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="background:#eff6ff;color:#0078E6;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0;">✓</div>
      <div>
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Квалификация</div>
        <div style="font-size:15px;color:#0f172a;font-weight:700;">{{.Qualification}}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="background:#f0fdf4;color:#16a34a;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0;">↗</div>
      <div>
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">ФИС ФРДО</div>
        <div style="font-size:15px;color:#0f172a;font-weight:700;">100% официальная выгрузка в госреестр</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="background:#fefce8;color:#ca8a04;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0;">→</div>
      <div>
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Формат подготовки</div>
        <div style="font-size:15px;color:#0f172a;font-weight:700;">Теория онлайн без отрыва от работы</div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
    <a href="{{.ButtonURL}}" class="sp-cta-button" style="background:linear-gradient(180deg,#ff7500 0%,#e06700 100%);color:#ffffff;padding:14px 28px;text-decoration:none;border-radius:6px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(255,117,0,.25);transition:all 0.2s ease;">
      <span>{{.ButtonText}}</span>
      <span style="font-size:18px;line-height:1;">→</span>
    </a>
    <span style="font-size:13px;color:#64748b;display:inline-flex;align-items:center;gap:6px;"><span style="color:#22c55e;">✓</span> Консультация методиста учебного центра по программам за 15 минут</span>
  </div>
</div>
<!-- /wp:html -->
